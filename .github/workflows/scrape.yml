name: 행사 수집

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: 단위 테스트
        run: python tests/test_parsers.py

      - name: 병원 게시판 수집
        run: python scraper/run.py --out docs/events.json --dump raw-html

      - name: 원본 HTML 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html
          path: raw-html
          retention-days: 7
          if-no-files-found: ignore

      - name: 변경 사항 커밋
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/events.json docs/notices.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
